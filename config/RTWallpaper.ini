; RTWallpaper configuration. Changes are applied as soon as the file is saved.
[General]
; Scene to render: marble | space
Scene=space
; Frame rate cap (lower = less GPU usage)
FPS=30
; Animation speed multiplier (1.0 = as designed / real time, 0.5 = half speed)
Speed=1.0

[Space]
; Earth day/night map width in pixels (height = width/2). 8192 = 8K
TextureSize=8192
; Live cloud map width: 1024 | 2048 | 4096 | 8192
CloudSize=8192
; Minutes between cloud map checks (only re-downloaded if it changed)
CloudUpdateMinutes=60
; Visual size multiplier for the satellites (1 = real size, sub-pixel)
SatelliteScale=1000
; Fraction of the screen covered by the Earth (the camera varies between both)
CoverageMin=0.40
CoverageMax=0.60
; 1 = never download (use the cache or the procedural Earth)
Offline=0
; Show the Earth at another time, in hours from now (0 = live)
TimeOffsetHours=0
; Initial point of interest (default Mexico) and minutes over it before following the ISS (-1 = always)
FocusLat=23.6
FocusLon=-102.5
FocusMinutes=20
; Milky Way orientation: scenic (always in view) | real (astronomical)
Galaxy=scenic
; Brightness of the Milky Way: 1 = as designed, lower = fainter and more see-through, 0 = stars only
GalaxyBrightness=1
; Clouds: flat (original flat layer) | layered (2.5D: height, relief, long shadows) | volumetric (= layered for now)
Clouds=layered
; Exaggeration of the cloud-top relief in layered mode (0 = none)
CloudRelief=2
; Length of the cloud shadows in layered mode: 1 = physical (hidden under the cloud unless the
; Sun is very low), 4 = stretched so they show at this scale, 0 = only right under the cloud
CloudShadowLength=4
; Brightness of the Sun's reflection on the sea: 1 = physical (Cox-Munk; dull unless seen at a
; grazing angle), 2.5 = as in photos from orbit, 0 = off
SunGlint=2.5
; Lightning, sprites, gigantic jets and elves over the storms on the night side. Not real
; events: an effect placed on the densest clouds. Frequency multiplier, 0 = off
Sprites=1
; Developer only: overview camera seeing the whole planet. In window mode, right-drag rotates
; and the wheel / touchpad pinch zooms; the view is saved for the next start.
DevMode=0
; Developer only (DevMode=1): one full Earth turn every N seconds (0 = no extra spin)
DevSpinSeconds=90
