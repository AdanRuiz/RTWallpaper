name: Code review
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # feature/github-action pinned to a commit; update the SHA when the action changes.
      - uses: AdanRuiz/advanced-code-review@main   # feature/github-action
        with:
          event-start: 2026-10-24T16:30:00-06:00   # opcional
          event-end: 2026-11-05T23:59:00-06:00     # opcional
          ai-review: true
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
